[project]
name = "minesafe-vision"
version = "1.0.0"
description = "Real-time PPE compliance and vehicle-proximity monitoring for mine and construction sites"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
