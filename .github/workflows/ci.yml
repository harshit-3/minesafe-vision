name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest httpx ruff
      - name: Lint
        run: ruff check src tests scripts app.py
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t minesafe .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api minesafe
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          img=$(ls tests/fixtures/*.jpg | head -1)
          curl -sf -X POST localhost:8000/detect -F "file=@$img" | tee out.json
          python3 -c "import json; r=json.load(open('out.json')); assert r['workers'] > 0, r; print('workers', r['workers'])"
